plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

group = 'com.blockforge'

// ── Read version from panel-version.properties (single source of truth) ──
def versionProps = new Properties()
file("src/main/resources/panel-version.properties").withInputStream { versionProps.load(it) }
version = versionProps.getProperty('version', '2.0dev-0')
ext {
    buildNumber = versionProps.getProperty('buildNumber', '0')
}

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.citizensnpcs.co/repo' }
    maven { url 'https://maven.playpro.com' }
    maven { url 'https://repo.alessiodp.com/releases/' }
    // Local libs folder for optional anticheat API JARs
    flatDir { dirs '../libs' }
}

dependencies {
    // Paper API for Minecraft 1.21
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'

    // LuckPerms API
    compileOnly 'net.luckperms:api:5.4'

    // PlaceholderAPI
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // Citizens API for NPC replays
    compileOnly 'net.citizensnpcs:citizens-main:2.0.35-SNAPSHOT'

    // CoreProtect API for block logging integration
    compileOnly 'net.coreprotect:coreprotect:23.1'

    // Database - HikariCP connection pool
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // SLF4J for HikariCP logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.slf4j:slf4j-simple:2.0.12'

    // SQLite JDBC driver
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'

    // MySQL Connector
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // WebSocket server
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'

    // JSON processing
    implementation 'com.google.code.gson:gson:2.11.0'

    // GeoIP2 for geographic IP lookups
    implementation 'com.maxmind.geoip2:geoip2:4.2.1'

    // Adventure API - bundled for Spigot compatibility (Paper provides its own at runtime)
    implementation 'net.kyori:adventure-api:4.17.0'
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'

    // Adventure Platform - enables sending Components on Spigot via BukkitAudiences
    implementation 'net.kyori:adventure-platform-bukkit:4.3.4'

    // Netty (provided by Minecraft server, used for same-port HTTP handling)
    compileOnly 'io.netty:netty-all:4.1.97.Final'

    // Optional: Anticheat API JARs in /libs folder for direct API access
    // ModereX uses reflection by default, so these are NOT required
    // Place anticheat plugin JARs in /libs if you want compile-time API access
    compileOnly fileTree(dir: '../libs', include: ['*.jar'])

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Bump the build number ───────────────────────────────────────────────
// Usage: ./gradlew bumpVersion
// Updates panel-version.properties (the single source of truth)
tasks.register('bumpVersion') {
    description = 'Increments the build number in panel-version.properties'
    group = 'versioning'

    def propsFile = file('src/main/resources/panel-version.properties')

    doLast {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }

        def currentVersion = props.getProperty('version')
        def currentBuild = Integer.parseInt(props.getProperty('buildNumber', '0'))
        def newBuild = currentBuild + 1

        def prefix = currentVersion.split('-')[0..-2].join('-')
        def newVersion = "${prefix}-${newBuild}"

        propsFile.text = """\
# ModereX Version - Edit this file to update the version everywhere.
# Gradle reads this at build time. Plugin reads this at runtime.
version=${newVersion}
buildNumber=${newBuild}
buildDate=${java.time.LocalDate.now().toString()}
"""
        logger.lifecycle("Version bumped: ${currentVersion} → ${newVersion}")
    }
}

// ── Build licensed JAR with embedded token ──────────────────────────────
// Usage: ./gradlew buildLicensed -PlicenseToken=<uuid-token> -PlicenseName="Tester Name"
// Creates a dev build with embedded license token for validation
tasks.register('buildLicensed') {
    description = 'Build ModereX JAR with embedded license token for dev builds'
    group = 'build'

    dependsOn clean, shadowJar

    doLast {
        def token = project.findProperty('licenseToken') ?: 'UNLICENSED'
        def licenseName = project.findProperty('licenseName') ?: 'Unknown'

        if (token == 'UNLICENSED') {
            throw new GradleException('License token required! Usage: ./gradlew buildLicensed -PlicenseToken=<uuid>')
        }

        def builtJar = shadowJar.archiveFile.get().asFile
        def releasesDir = rootProject.file('releases/licensed')
        releasesDir.mkdirs()

        def shortToken = token.take(8)
        def licensedJar = new File(releasesDir, "ModereX-licensed-${shortToken}.jar")

        // Copy the built JAR
        builtJar.withInputStream { input ->
            licensedJar.withOutputStream { output ->
                output << input
            }
        }

        // Patch the license token INTO the JAR using ZIP filesystem
        def jarUri = java.net.URI.create("jar:" + licensedJar.toURI())
        def zipFs = java.nio.file.FileSystems.newFileSystem(jarUri, [:])
        def propsPath = zipFs.getPath("license-token.properties")
        java.nio.file.Files.writeString(propsPath,
            "# ModereX License Token - Embedded at build time\n" +
            "token=${token}\n" +
            "licensedTo=${licenseName}\n" +
            "buildTimestamp=${System.currentTimeMillis()}\n")
        zipFs.close()

        logger.lifecycle("License token embedded: ${token.take(8)}...${token.takeRight(4)}")
        logger.lifecycle("Licensed to: ${licenseName}")
        logger.lifecycle("Licensed JAR created: ${licensedJar.name}")
        logger.lifecycle("Output: ${licensedJar.absolutePath}")
    }
}

// ── Shadow JAR configuration ────────────────────────────────────────────
shadowJar {
    archiveClassifier.set('')
    archiveFileName.set("ModereX-${version}.jar")

    relocate 'com.zaxxer.hikari', 'com.blockforge.moderex.lib.hikari'
    relocate 'org.java_websocket', 'com.blockforge.moderex.lib.websocket'
    relocate 'com.google.gson', 'com.blockforge.moderex.lib.gson'
    relocate 'org.slf4j', 'com.blockforge.moderex.lib.slf4j'
    relocate 'com.maxmind.geoip2', 'com.blockforge.moderex.lib.geoip2'
    relocate 'com.maxmind.db', 'com.blockforge.moderex.lib.maxminddb'

    // Don't minimize - include all dependency classes to avoid ClassNotFound errors
    // minimize() can aggressively remove classes that are loaded via reflection

    // After building, copy the JAR to releases/ModereX-latest.jar
    // Capture path at configuration time (configuration cache compatible)
    def releasesDir = rootProject.file('releases')
    doLast {
        def builtJar = archiveFile.get().asFile
        releasesDir.mkdirs()

        def latestJar = new File(releasesDir, 'ModereX-latest.jar')
        builtJar.withInputStream { input ->
            latestJar.withOutputStream { output ->
                output << input
            }
        }
    }
}

tasks.named('build') {
    dependsOn shadowJar
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['plugin.yml', 'paper-plugin.yml']) {
        expand props
    }
}
