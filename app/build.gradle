plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

group = 'com.blockforge'
version = '2.0dev-280'

// ── Derived version properties (single source of truth: version above) ──
ext {
    buildNumber = version.toString().split('-').last()
    buildDate = java.time.LocalDate.now().toString()
}

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.citizensnpcs.co/repo' }
    maven { url 'https://maven.playpro.com' }
    maven { url 'https://repo.alessiodp.com/releases/' }
    // Local libs folder for optional anticheat API JARs
    flatDir { dirs '../libs' }
}

dependencies {
    // Paper API for Minecraft 1.21
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'

    // LuckPerms API
    compileOnly 'net.luckperms:api:5.4'

    // PlaceholderAPI
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // Citizens API for NPC replays
    compileOnly 'net.citizensnpcs:citizens-main:2.0.35-SNAPSHOT'

    // CoreProtect API for block logging integration
    compileOnly 'net.coreprotect:coreprotect:23.1'

    // Database - HikariCP connection pool
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // SLF4J for HikariCP logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.slf4j:slf4j-simple:2.0.12'

    // SQLite JDBC driver
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'

    // MySQL Connector
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // WebSocket server
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'

    // JSON processing
    implementation 'com.google.code.gson:gson:2.11.0'

    // GeoIP2 for geographic IP lookups
    implementation 'com.maxmind.geoip2:geoip2:4.2.1'

    // Adventure API - bundled for Spigot compatibility (Paper provides its own at runtime)
    implementation 'net.kyori:adventure-api:4.17.0'
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'

    // Adventure Platform - enables sending Components on Spigot via BukkitAudiences
    implementation 'net.kyori:adventure-platform-bukkit:4.3.4'

    // Netty (provided by Minecraft server, used for same-port HTTP handling)
    compileOnly 'io.netty:netty-all:4.1.97.Final'

    // Optional: Anticheat API JARs in /libs folder for direct API access
    // ModereX uses reflection by default, so these are NOT required
    // Place anticheat plugin JARs in /libs if you want compile-time API access
    compileOnly fileTree(dir: '../libs', include: ['*.jar'])

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Generate version files from the single source of truth ──────────────
tasks.register('generateVersionFiles') {
    description = 'Auto-generates panel-version.properties and releases/build-info.txt from build.gradle version'
    group = 'build'

    // Declare inputs so Gradle can cache / skip when nothing changed
    inputs.property('version', version)
    inputs.property('buildNumber', buildNumber)

    // Declare outputs so Gradle knows what this task produces
    def panelVersionFile = file("src/main/resources/panel-version.properties")
    def buildInfoFile = project.rootProject.file("releases/build-info.txt")
    outputs.file(panelVersionFile)
    outputs.file(buildInfoFile)

    doLast {
        // Get version from inputs (configuration cache compatible)
        def versionStr = inputs.properties.get('version')
        def buildNum = inputs.properties.get('buildNumber')

        // Get the current git commit hash
        def gitHash = 'unknown'
        try {
            def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, project.rootProject.projectDir)
            proc.waitFor()
            if (proc.exitValue() == 0) {
                gitHash = proc.text.trim()
            }
        } catch (Exception ignored) {
            logger.warn('Could not determine git commit hash, using "unknown"')
        }

        def now = java.time.Instant.now().toString()
        def buildDateStr = java.time.LocalDate.now().toString()

        // Generate panel-version.properties
        panelVersionFile.text = """\
version=${versionStr}
buildDate=${buildDateStr}
buildNumber=${buildNum}
notes=Auto-generated from build
"""
        logger.lifecycle("Generated panel-version.properties (v${versionStr}, build ${buildNum})")

        // Ensure releases/ directory exists
        buildInfoFile.parentFile.mkdirs()

        // Generate releases/build-info.txt
        buildInfoFile.text = """\
${now}
Version: ${versionStr}
Build: ${buildNum}
Commit: ${gitHash}
"""
        logger.lifecycle("Generated releases/build-info.txt (commit ${gitHash})")
    }
}

// Make processResources depend on generateVersionFiles so they are always fresh
tasks.named('processResources') {
    dependsOn 'generateVersionFiles'
}

// ── Bump the build number ───────────────────────────────────────────────
tasks.register('bumpVersion') {
    description = 'Increments the build number in build.gradle (e.g. 2.0dev-280 → 2.0dev-281)'
    group = 'versioning'

    doLast {
        def buildFile = file('build.gradle')
        def content = buildFile.text
        def pattern = ~/version\s*=\s*'([^']+)'/
        def matcher = pattern.matcher(content)

        if (!matcher.find()) {
            throw new GradleException('Could not find version string in build.gradle')
        }

        def currentVersion = matcher.group(1)
        def parts = currentVersion.split('-')
        if (parts.length < 2) {
            throw new GradleException("Version '${currentVersion}' does not contain a hyphen-separated build number")
        }

        def prefix = parts[0..-2].join('-')
        def currentBuild = parts[-1] as int
        def newBuild = currentBuild + 1
        def newVersion = "${prefix}-${newBuild}"

        def updatedContent = content.replace("version = '${currentVersion}'", "version = '${newVersion}'")
        buildFile.text = updatedContent

        logger.lifecycle("Version bumped: ${currentVersion} → ${newVersion}")
    }
}

// ── Shadow JAR configuration ────────────────────────────────────────────
shadowJar {
    archiveClassifier.set('')
    archiveFileName.set("ModereX-${version}.jar")

    relocate 'com.zaxxer.hikari', 'com.blockforge.moderex.lib.hikari'
    relocate 'org.java_websocket', 'com.blockforge.moderex.lib.websocket'
    relocate 'com.google.gson', 'com.blockforge.moderex.lib.gson'
    relocate 'org.slf4j', 'com.blockforge.moderex.lib.slf4j'
    relocate 'com.maxmind.geoip2', 'com.blockforge.moderex.lib.geoip2'
    relocate 'com.maxmind.db', 'com.blockforge.moderex.lib.maxminddb'

    // Don't minimize - include all dependency classes to avoid ClassNotFound errors
    // minimize() can aggressively remove classes that are loaded via reflection

    // After building, copy the JAR to releases/ModereX-latest.jar
    doLast {
        def builtJar = archiveFile.get().asFile
        def releasesDir = project.rootProject.file('releases')
        releasesDir.mkdirs()

        def latestJar = new File(releasesDir, 'ModereX-latest.jar')
        builtJar.withInputStream { input ->
            latestJar.withOutputStream { output ->
                output << input
            }
        }
        logger.lifecycle("Copied ${builtJar.name} → releases/ModereX-latest.jar")
    }
}

tasks.named('build') {
    dependsOn shadowJar
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['plugin.yml', 'paper-plugin.yml']) {
        expand props
    }
}
