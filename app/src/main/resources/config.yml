# ModereX Configuration
# Advanced Moderation Plugin for Minecraft 1.21+

# ============================================
# GENERAL SETTINGS
# ============================================
general:
  # Default language (en_US, es_ES, de_DE, fr_FR, pt_BR, zh_CN)
  language: en_US

  # Timezone for date/time display (e.g., America/Chicago, UTC, Europe/London)
  timezone: America/Chicago

  # Enable debug mode for verbose logging
  debug: false

  # Discord webhook URL for debug logs (leave empty to disable)
  # Logs are formatted with diff syntax: - for errors, + for success, plain for debug
  debug-webhook: ''

  # Use 1.21.6+ dialog system instead of chest GUIs when available
  dialogs-enabled: true

# ============================================
# RESOURCE PACK SETTINGS
# ============================================
resourcepack:
  # Enable custom resource pack for staff GUIs
  # Provides custom textures for GUI items (shields, icons, etc.)
  enabled: true

  # Only send to players with moderex.staff permission
  # When false, sends to all players (not recommended)
  staff-only: true

  # Resource pack hosting method:
  # - 'bundled': Host from plugin (uses web panel port, requires webpanel enabled)
  # - 'external': Use an external URL (specify in 'external-url')
  hosting: bundled

  # External URL for resource pack (only used if hosting: external)
  # Upload the pack to a hosting service and put the direct download URL here
  external-url: ''

  # Prompt message shown when requesting resource pack
  prompt-message: '&7ModereX requires a resource pack for the best experience.'

  # Force resource pack (kick if declined)
  # Only applies to staff members
  required: false

# ============================================
# DATABASE SETTINGS
# ============================================
database:
  # Database type: sqlite or mysql
  type: sqlite

  # MySQL settings (only used if type is mysql)
  mysql:
    host: localhost
    port: 3306
    database: moderex
    username: root
    password: ''
    # Connection pool size
    pool-size: 10

# ============================================
# WEB PANEL SETTINGS
# ============================================
webpanel:
  # Enable web panel server (HTTP + WebSocket on same port)
  enabled: false

  # Server port for the web panel (serves both HTTP and WebSocket)
  # Access the panel at: http://localhost:8080/
  port: 8080

  # Public host/IP for clients to connect (leave empty to auto-detect)
  # Set this if your server is behind a proxy or has a custom domain
  host: ''

  # Server name displayed in the web panel
  server-name: 'My Server'


  # EXPERIMENTAL: Host web panel on same port as Minecraft server
  # Uses Netty injection to detect HTTP traffic on the game port
  # Not recommended for production - use the dedicated port instead
  # When enabled, you can access the panel at: http://your-server:25565/
  same-port: false

  # Token validation interval in seconds (checks if session is still valid)
  token-validation-interval: 10

  # LuckPerms rank display colors for web panel
  # Maps LuckPerms group names to hex color codes
  # These colors are used for the rank badge glow effect
  rank-colors:
    owner: '#ff5555'      # Red
    admin: '#ff5555'      # Red
    moderator: '#55ff55'  # Green
    helper: '#55ffff'     # Cyan
    builder: '#ffaa00'    # Orange
    vip: '#aa00aa'        # Purple
    default: '#8b5cf6'    # Default purple

# ============================================
# PROXY SETTINGS
# ============================================
proxy:
  # Enable proxy support for cross-server punishments
  enabled: false

  # Proxy type: bungeecord or velocity
  type: bungeecord

# ============================================
# GEOIP SETTINGS
# ============================================
geoip:
  # Enable GeoIP lookups for geographic information based on IP addresses
  enabled: false

  # Path to MaxMind GeoLite2-City database file
  # Download for free from: https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
  # You'll need to create a free account to download the database
  # After downloading, extract the .mmdb file and place it at this path
  database-path: 'plugins/ModereX/GeoLite2-City.mmdb'

# ============================================
# UPDATE CHECKER
# ============================================
update-checker:
  # Check for updates on Modrinth
  enabled: true

# ============================================
# GITHUB AUTO-UPDATE
# ============================================
github-update:
  # Enable automatic update checking from GitHub releases
  enabled: true
  # Automatically download new versions (saves to plugins/update folder)
  auto-download: true
  # GitHub repository (owner/repo format)
  repo: 'Midnwave/ModereX'
  # GitHub Personal Access Token (required for private repos, leave empty for public)
  token: ''

# ============================================
# ANTICHEAT INTEGRATION
# ============================================
anticheat:
  # Auto-detect installed anticheat plugins
  auto-detect: true

  # Manual selection (auto, grim, vulcan, matrix, spartan, ncp, themis, foxaddition, lightac)
  provider: auto

  # Replace anticheat alert messages with ModereX branding
  # When true, ModereX shows its own styled alerts instead of original format
  # NOTE: For full rebranding, also disable alerts in your anticheat's config
  # Example for Grim: set alerts.enabled to false in grim.yml
  rebrand-alerts: true

  # Attempt to block original anticheat messages
  # Works best with anticheats that use events (Vulcan, Matrix)
  # For others, disable their built-in alerts in their config
  block-original-messages: true

  # Alert settings
  alerts:
    # Global toggle
    enabled: true

    # Minimum VL before showing alert (prevents spam)
    min-vl: 5

    # Default alert threshold (X alerts in Y time before showing)
    default-threshold:
      count: 3
      duration: 60s

    # Cooldown between alerts for same player/check (seconds)
    cooldown: 5

  # Per-anticheat settings (override defaults)
  grim:
    enabled: true
    min-vl: 5
  vulcan:
    enabled: true
    min-vl: 10
  matrix:
    enabled: true
    min-vl: 5
  spartan:
    enabled: true
    min-vl: 10
  ncp:
    enabled: true
    min-vl: 10
  themis:
    enabled: true
    min-vl: 5
  foxaddition:
    enabled: true
    min-vl: 5
  lightac:
    enabled: true
    min-vl: 5

# ============================================
# STAFF SETTINGS
# ============================================
staff:
  # Play sound when staff chat message is received
  chat-sound-enabled: true

  # Sound to play (Bukkit Sound enum name)
  chat-sound: ENTITY_ITEM_PICKUP

  # How long to keep staff chat messages in the database (in days)
  # Set to -1 to keep forever
  chat-history-retention: 30

# ============================================
# JOIN/LEAVE MESSAGES
# ============================================
join-leave:
  # Who can see join/leave messages
  # Options: ALL, MODERATORS_ONLY, OFF
  # Note: Web panel always receives events, watchlist alerts still work
  visibility: ALL

  # Remove default Minecraft join/leave messages
  # When true, vanilla "Player joined/left the game" is suppressed
  suppress-vanilla: true

  # Custom join message format (uses MiniMessage)
  # Placeholders: <player>, <player_prefix>
  join-format: "<gray><player_prefix><yellow><player></yellow> joined the server"

  # Custom leave message format (uses MiniMessage)
  # Placeholders: <player>, <player_prefix>
  leave-format: "<gray><player_prefix><yellow><player></yellow> left the server"

# ============================================
# CHAT SETTINGS
# ============================================
chat:
  # Default chat slowmode in seconds (0 = disabled)
  default-slowmode: 0

  # Is chat enabled by default
  enabled: true

# ============================================
# MUTE SETTINGS
# ============================================
mute:
  # Allow muted players to use commands (like /msg, /tell, /w)
  allow-commands: false

  # Allow muted players to write on signs
  allow-signs: false

  # Commands blocked while muted (if allow-commands is false)
  blocked-commands:
    - msg
    - tell
    - w
    - whisper
    - reply
    - r
    - me
    - say
    - broadcast

# ============================================
# VANISH SETTINGS
# ============================================
vanish:
  # Hide vanished players from tab list
  hide-from-tablist: true

  # Open containers silently (no animation/sound for others)
  silent-containers: true

  # Disable footstep particles/sounds
  no-footsteps: true

  # Hide real join/leave messages when player joins/leaves while vanished
  # When true, suppresses the vanilla "Player joined/left the game" messages
  hide-real-join-leave: true

  # Persist vanish state across server restarts and logouts
  # When true, players remain vanished when they rejoin the server
  save-vanish-state: true

  # Use packet-level vanishing (NMS) instead of Bukkit hidePlayer()
  # Provides complete invisibility by filtering packets at the Netty pipeline level
  # Fallback to hidePlayer() if packet injection fails
  use-packet-level: true

  # Debug packet filtering (log filtered packets [very verbose])
  debug-packet-filtering: false

  # Plugin API whitelist - plugins that can see vanished players
  # By default, vanished players are hidden from ALL plugins
  # Add plugin names here (case-insensitive) to allow them to detect vanished players
  # Example: ['YourCustomPlugin', 'AdminTools']
  # Note: ModereX itself always has access
  api-whitelist: []

  # ============================================
  # FAKE JOIN/LEAVE MESSAGES
  # ============================================
  fake-messages:
    # Send fake join/leave messages when vanishing/unvanishing
    enabled: false

    # Fake join message (supports placeholders: {player})
    join-message: '&e{player} joined the game'

    # Fake leave message (supports placeholders: {player})
    leave-message: '&e{player} left the game'

  # ============================================
  # PLUGIN HOOKS
  # ============================================
  plugin-hooks:
    # Hook into EssentialsX join/leave messages
    essentialsx:
      enabled: false
      # Hide join/leave messages for vanished players
      hide-messages: true

    # Hook into custom-join-messages plugin
    custom-join-messages:
      enabled: false
      hide-messages: true

    # Hook into AlonsoJoin plugin
    alonsojoin:
      enabled: false
      hide-messages: true

  # ============================================
  # LEVEL-BASED VISIBILITY SYSTEM
  # ============================================
  levels:
    # Enable level-based visibility (staff can see lower-level vanished players)
    enabled: true

    # Default vanish level for players without specific permission
    default-level: 1

    # Vanish level for opped players (highest priority)
    op-level: 100

    # Permission format: moderex.vanish.level.<number>
    # Example: moderex.vanish.level.3 gives vanish level 3
    # A player with level 3 can see vanished players with level 1 and 2
    # A player with level 3 CANNOT see other level 3 players

    # Staff visibility settings
    staff-visibility:
      # Allow staff to see vanished players with lower levels
      can-see-lower-levels: true

      # Permission format for seeing vanished players: moderex.vanish.see.level.<number>
      # Example: moderex.vanish.see.level.2 allows seeing vanished players up to level 2
      # If not set, defaults to their vanish level - 1

  # ============================================
  # LUCKPERMS INTEGRATION
  # ============================================
  luckperms:
    # Modify player prefix/suffix when vanished
    enabled: false

    # Prefix to add when vanished (supports color codes and placeholders)
    vanish-prefix: '&7[V] '

    # Suffix to add when vanished (supports color codes and placeholders)
    vanish-suffix: ''

    # Also modify tab list prefix/suffix
    modify-tab: true

  # ============================================
  # VANISH LIST COMMAND
  # ============================================
  list:
    # Show only vanished players the viewer can see (based on their level)
    # If false, shows all vanished players regardless of level
    respect-visibility: true

    # Show vanish levels in the list
    show-levels: true

    # Format for each player in the list
    # Placeholders: {player}, {level}, {time} (how long they've been vanished)
    format: '&7- &f{player} &8(Level {level})'

  # ============================================
  # GRANULAR PERMISSIONS
  # ============================================
  # Control what vanished staff can do while vanished
  # By default, all actions are blocked unless the player has the specific permission
  #
  # Available permissions:
  # - moderex.vanish.pickup: Allow picking up items/arrows while vanished (default: false)
  # - moderex.vanish.chat: Allow chatting while vanished (default: false)
  # - moderex.vanish.place: Allow placing blocks while vanished (default: false)
  # - moderex.vanish.break: Allow breaking blocks while vanished (default: false)
  # - moderex.vanish.attack: Allow attacking entities while vanished (default: false)
  # - moderex.vanish.mobattack: Allow being attacked by mobs while vanished (default: false)
  #
  # Example LuckPerms setup:
  # /lp group moderator permission set moderex.vanish.chat true
  # /lp group admin permission set moderex.vanish.* true

  # ============================================
  # FLIGHT TOGGLE
  # ============================================
  # Enable flight when vanishing (requires moderex.vanish.flight permission)
  enable-flight: true

  # ============================================
  # SPECTATOR MODE
  # ============================================
  # Enable double-sneak to toggle spectator mode (requires moderex.vanish.spectator permission)
  double-sneak-spectator: true

  # Time threshold for double-sneak detection (milliseconds)
  double-sneak-threshold: 500

# ============================================
# DISGUISE SETTINGS
# ============================================
disguise:
  # Enable disguise system
  enabled: true

  # Use LuckPerms groups as disguise ranks
  # If false, uses ranks defined below
  use-luckperms-groups: true

  # Spoof join/quit messages with disguised name
  spoof-join-quit-messages: true

  # Join message format (supports {player} placeholder)
  join-message-format: '&e{player} joined the game'

  # Quit message format (supports {player} placeholder)
  quit-message-format: '&e{player} left the game'

  # Save disguise state across restarts
  persistent: true

  # Fallback ranks (used if LuckPerms is not available or use-luckperms-groups is false)
  ranks:
    default:
      display-name: "Default"
      description: "Default player rank"
      prefix: ""
      skull-texture: null

    vip:
      display-name: "VIP"
      description: "VIP player rank"
      prefix: "&6[VIP] "
      skull-texture: null

    moderator:
      display-name: "Moderator"
      description: "Server moderator"
      prefix: "&9[Mod] "
      skull-texture: null

    admin:
      display-name: "Admin"
      description: "Server administrator"
      prefix: "&c[Admin] "
      skull-texture: null

  # Permission format: moderex.disguise.rank.<rank>
  # Example: moderex.disguise.rank.vip allows disguising as VIP rank
  # Example: moderex.disguise.rank.* allows disguising as any rank

# ============================================
# COMMAND BLACKLIST SETTINGS
# ============================================
command-blacklist:
  # Whether staff can blacklist other players from using ModereX commands
  # This is disabled by default for safety - being able to blacklist an admin
  # from using /ban or /unban could be problematic
  allow-moderex-commands: false

  # Commands that can never be blacklisted (core server commands)
  # These are always protected regardless of the above setting
  protected-commands:
    - 'stop'
    - 'reload'
    - 'op'
    - 'deop'
    - 'whitelist'

# ============================================
# WARNING SETTINGS
# ============================================
warnings:
  # Default warning expiry time (e.g., 30d, 0 = never expire)
  default-expiry: 30d

  # Auto-punishments based on warning count
  # These can also be configured in-game with /mx warningsettings
  auto-punishments:
    # After 3 warnings in 7 days, mute for 1 hour
    3:
      within: 7d
      action: mute
      duration: 1h
    # After 5 warnings in 14 days, mute for 1 day
    5:
      within: 14d
      action: mute
      duration: 1d
    # After 7 warnings in 30 days, temp ban for 7 days
    7:
      within: 30d
      action: ban
      duration: 7d
    # After 10 warnings ever, permanent ban
    10:
      within: 0
      action: ban
      duration: permanent

# ============================================
# REPLAY SETTINGS
# ============================================
replay:
  # Enable replay recording system
  enabled: true

  # Automatically record when anticheat alert is triggered
  record-on-anticheat: true

  # Automatically record watchlisted players
  record-watchlist: true

  # Radius to record nearby players (blocks)
  nearby-radius: 20

  # Maximum recording duration in seconds
  max-duration-seconds: 300

  # Maximum number of stored replays
  max-stored: 1000

# ============================================
# ACTIVITY LOG SETTINGS
# ============================================
# Logs player activity for review with /log command
activity-log:
  # Enable activity logging
  enabled: true

  # Storage type: database, h2, yml, json, text
  # 'database' uses the main plugin database (recommended)
  storage-type: database

  # Number of entries per page in /log output
  entries-per-page: 10

  # Retention periods for different log types (in days)
  # Set to -1 for unlimited (never purge), 0 to disable logging entirely
  # Default is 30 days for all types
  retention:
    # Activity logs
    chat: 30             # Chat messages
    commands: 30         # Commands executed
    signs: 30            # Sign text with location
    sessions: 30         # Login/logout with duration
    items: 30            # Item drops, pickups, use, consume, projectiles
    anvils: 30           # Anvil renaming of items
    usernames: -1        # Username changes (keep forever by default)
    ip-changes: -1       # IP address changes (keep forever by default)

    # Moderation logs
    punishments: -1      # Bans, mutes, warns, kicks (keep forever by default)
    pardons: -1          # Unbans, unmutes, etc. (keep forever by default)
    automod: 30          # Automod triggers
    anticheat: 30        # Anticheat alerts

    # Staff action logs
    staff-actions: 90    # Staff punishment/pardon actions
    watchlist: 90        # Watchlist add/remove/notes

  # Maximum entries to show in command output
  max-chat-logs: 50      # /log chat output
  max-command-logs: 100  # /cmdhistory output

  # What to log (all enabled by default)
  log:
    chat: true           # Chat messages
    commands: true       # Commands executed (sensitive commands are redacted)
    signs: true          # Sign text with location (click to teleport)
    items: true          # Item drops, pickups, use, consume, projectiles
    anvils: true         # Anvil renaming of items
    sessions: true       # Login/logout with duration
    usernames: true      # Username changes

# ============================================
# EVIDENCE SYSTEM
# ============================================
evidence:
  # Maximum file upload size in MB (hard limit: 1000 MB)
  max-file-size-mb: 250

  # Require evidence when issuing punishments
  # If true, staff must attach at least one piece of evidence to punish
  require-evidence: false

  # Maximum number of activity log entries that can be attached as evidence
  max-activity-log-evidence: 5

# ============================================
# PLAYER PUNISHMENT PORTAL
# ============================================
player-portal:
  # Enable the player punishment portal
  # Players can view their punishment details and evidence at a unique URL
  enabled: true

  # Session expiry time in hours
  # Players must generate a new link after this time
  session-expiry-hours: 12

# ============================================
# GATEWAY CONNECTION
# ============================================
# Connect to the ModereX Gateway for easy web panel access
# When enabled, your panel is accessible at: panel.moderex.net/{server-id}/
# No port forwarding, SSL certificates, or Cloudflare Tunnel setup required!
gateway:
  # Enable gateway connection (set to false to opt-out of moderex.net hosting)
  # When disabled, panel is only accessible via direct IP:port
  enabled: true

  # Gateway server URL (you shouldn't need to change this)
  url: wss://neighbors-steps-unable-stop.trycloudflare.com/server

  # Delay between reconnection attempts (seconds)
  reconnect-delay-seconds: 5

  # Maximum reconnection attempts (-1 = infinite, keeps trying forever)
  max-reconnect-attempts: -1

  # Enable verbose gateway logging in console (for debugging)
  debug-logging: false

# ============================================
# CONFIGURATION VERSION
# ============================================
# DO NOT MODIFY - Used for automatic config migration
config-version: 16





