name: ModereX
version: '${version}'
main: com.blockforge.moderex.ModereX
api-version: '1.21'
description: |
  Advanced, premium moderation for Minecraft.

  Copyright (c) 2024-2026 BlockForge Studios. All rights reserved.
  The ModereX Web Panel and all associated assets are proprietary software.
  Redistribution, modification, or commercial use of the web panel component
  is strictly prohibited without explicit written permission from BlockForge Studios.
author: BlockForge Studios, ADF Industries
website: https://github.com/blockforge/moderex
softdepend:
  - LuckPerms
  - PlaceholderAPI
  - Essentials
  - CustomJoinMessages
  - AlonsoJoin
  - Grim
  - Vulcan
  - Matrix
  - Spartan
  - Intave
  - Karhu
  - Polar
  - NoCheatPlus
  - spark
  - Citizens
  - CoreProtect
  - Geyser-Spigot
  - floodgate
  - voicechat
  - BlueMap

commands:
  # Main Command
  moderex:
    description: Main ModereX command with administrative subcommands
    usage: /<command> [subcommand] [args]
    aliases: [mx]

  # Core Punishment Commands
  ban:
    description: Ban a player from the server
    usage: /<command> <player> [duration] [reason] [flags]
    permission: moderex.ban

  mute:
    description: Mute a player, preventing them from chatting
    usage: /<command> <player> [duration] [reason] [flags]
    permission: moderex.mute

  warn:
    description: Warn a player
    usage: /<command> <player> [duration] [reason] [flags]
    permission: moderex.warn

  kick:
    description: Kick a player from the server
    usage: /<command> <player> [reason] [flags]
    permission: moderex.kick

  # Temporary Punishment Commands
  tempban:
    description: Temporarily ban a player (duration required)
    usage: /<command> <player> <duration> [reason] [flags]
    permission: moderex.tempban

  tempmute:
    description: Temporarily mute a player (duration required)
    usage: /<command> <player> <duration> [reason] [flags]
    permission: moderex.tempmute

  # IP-Based Punishment Commands
  ipban:
    description: Ban a player by IP address
    usage: /<command> <player> [duration] [reason] [flags]
    permission: moderex.ipban
    aliases: [banip, ban-ip]

  ipmute:
    description: Mute a player by IP address
    usage: /<command> <player> [duration] [reason] [flags]
    permission: moderex.ipmute
    aliases: [muteip]

  # Unpunishment Commands
  unban:
    description: Remove an active ban
    usage: /<command> <player|id> [reason] [flags]
    permission: moderex.unban

  unmute:
    description: Remove an active mute
    usage: /<command> <player|id> [reason] [flags]
    permission: moderex.unmute

  unwarn:
    description: Remove an active warning
    usage: /<command> <player|id> [reason] [flags]
    permission: moderex.unwarn

  # Check Commands
  check:
    description: Check comprehensive player information
    usage: /<command> <player>
    permission: moderex.check

  checkban:
    description: Check if a player is banned
    usage: /<command> <user|id>
    permission: moderex.checkban

  checkmute:
    description: Check if a player is muted
    usage: /<command> <user|id>
    permission: moderex.checkmute

  checkwarn:
    description: Check active warnings for a player
    usage: /<command> <user|id>
    permission: moderex.checkwarn

  # Activity Log Commands
  history:
    description: View punishment history and activity logs for a player
    usage: /<command> <user> [type]
    permission: moderex.logs
    aliases: [hist, log]

  staffhistory:
    description: View punishments executed by a staff member
    usage: /<command> <staff> [type]
    permission: moderex.staffhistory
    aliases: [staffhist]

  warnings:
    description: View active warnings (for self or specified player)
    usage: /<command> [user]
    permission: moderex.warnings

  banlist:
    description: View a paginated list of active bans
    usage: /<command> [page]
    permission: moderex.banlist

  mutelist:
    description: View a paginated list of active mutes
    usage: /<command> [page]
    permission: moderex.mutelist

  warnlist:
    description: View a paginated list of active warnings
    usage: /<command> [page]
    permission: moderex.warnlist

  viewpunishment:
    description: View detailed information about a punishment by case ID
    usage: /<command> <caseId>
    permission: moderex.command.viewpunishment
    aliases: [vp, case, punishinfo]

  # Account & IP Commands
  dupeip:
    description: Display associated accounts of a user or IP
    usage: /<command> <user|ip>
    permission: moderex.dupeip
    aliases: [alts, checkalts]

  iphistory:
    description: Display IP history for a user (console default)
    usage: /<command> <user|ip>
    permission: moderex.iphistory

  ipreport:
    description: Show duplicate IPs among online players
    usage: /<command>
    permission: moderex.ipreport

  geoip:
    description: Display a user's country based on IP
    usage: /<command> <user>
    permission: moderex.geoip

  lastuuid:
    description: Display a user's UUID
    usage: /<command> <user>
    permission: moderex.lastuuid

  namehistory:
    description: Display previous usernames for a player
    usage: /<command> <user>
    permission: moderex.namehistory

  automodhistory:
    description: View a player's automod trigger history
    usage: /<command> <player> [page|-gui]
    aliases: [amhistory, automodlog]
    permission: moderex.log.automod

  nickhistory:
    description: View a player's nickname change history
    usage: /<command> <player> [page|-gui]
    aliases: [nicknamehistory, nicklog]
    permission: moderex.log.nicknames

  # Admin Commands
  lockdown:
    description: Enable or disable server lockdown mode
    usage: /<command> [server:local|global] [end]
    permission: moderex.lockdown

  prunehistory:
    description: Remove inactive punishments from history
    usage: /<command> <user> [duration]
    permission: moderex.prunehistory

  staffrollback:
    description: Rollback all punishments executed by a staff member
    usage: /<command> <staff> [duration]
    permission: moderex.staffrollback

  punish:
    description: Open punishment GUI
    usage: /<command> [player]
    permission: moderex.punish

  modlog:
    description: View moderation log for a player
    usage: /<command> <player> [filter]
    permission: moderex.modlog

  staffchat:
    description: Staff chat toggle or message
    usage: /<command> <on|off|message>
    aliases: [sc]
    permission: moderex.staffchat

  staffhelp:
    description: Request help from staff
    usage: /<command>
    permission: moderex.staffhelp

  watchlist:
    description: Manage watchlist of suspicious players
    usage: /<command> [gui|add|remove|list|note|check] [player] [reason/note]
    aliases: [wl]
    permission: moderex.command.watchlist

  vanish:
    description: Toggle vanish mode and manage vanished players
    usage: /<command> [toggle|enable|disable|player|list] [player]
    aliases: [v]
    permission: moderex.vanish

  cmdblacklist:
    description: Blacklist a command for a player
    usage: /<command> <player> <command> [duration]
    permission: moderex.cmdblacklist

  cmdunblacklist:
    description: Remove command blacklist from a player
    usage: /<command> <player> <command>
    permission: moderex.cmdunblacklist

  cmdhistory:
    description: View command history for a player
    usage: /<command> <player> [page]
    permission: moderex.cmdhistory

  log:
    description: View player activity log
    usage: /<command> <player> [action:type] [time:duration] [page]
    permission: moderex.log
    aliases: [activitylog, playerlog]

  seen:
    description: View when a player was last seen and player info
    usage: /<command> <player>
    permission: moderex.command.seen
    aliases: [playerinfo, lastseen]

  disguise:
    description: Disguise as another player
    usage: /<command> [name] [rank] | gui | remove
    aliases: [d]
    permission: moderex.disguise

  disguisename:
    description: Change disguise name
    usage: /<command> <name>
    aliases: [dname]
    permission: moderex.disguise

  disguiseskin:
    description: Change disguise skin
    usage: /<command> <playerName>
    aliases: [dskin]
    permission: moderex.disguise

  rules:
    description: View server rules
    usage: /<command> [page|rule#|category]
    aliases: [serverrules]
    permission: moderex.rules

  # Staff Utility Commands
  fly:
    description: Toggle flight mode for yourself or another player
    usage: /<command> [player]
    aliases: [mxfly, flight]
    permission: moderex.command.fly

  broadcast:
    description: Broadcast a message to all players
    usage: /<command> <message>
    aliases: [bc, mxbc, announce]
    permission: moderex.command.broadcast

  invsee:
    description: View another player's inventory
    usage: /<command> <player>
    aliases: [mxinvsee, openinv]
    permission: moderex.command.invsee

  echest:
    description: View a player's ender chest
    usage: /<command> [player]
    aliases: [enderchest, endersee, mxechest]
    permission: moderex.command.echest

  # Replay system commands
  replay:
    description: Replay system - record and playback player actions
    usage: /<command> [start|stop|play|list|search|delete|status|help] [args]
    aliases: [replays]
    permission: moderex.command.admin

  # Shorthand aliases for moderation commands
  mban:
    description: Shorthand for /ban
    permission: moderex.ban

  munban:
    description: Shorthand for /unban
    permission: moderex.unban

  mmute:
    description: Shorthand for /mute
    permission: moderex.mute

  munmute:
    description: Shorthand for /unmute
    permission: moderex.unmute

  mwarn:
    description: Shorthand for /warn
    permission: moderex.warn

  munwarn:
    description: Shorthand for /unwarn
    permission: moderex.unwarn

  mkick:
    description: Shorthand for /kick
    permission: moderex.kick

  # Mass Punishment Commands
  masswarn:
    description: Warn multiple players at once
    usage: /<command> <player1,player2,...> [duration] <reason>
    permission: moderex.masswarn

  massmute:
    description: Mute multiple players at once
    usage: /<command> <player1,player2,...> <duration> <reason>
    permission: moderex.massmute

  masskick:
    description: Kick multiple players at once
    usage: /<command> <player1,player2,...> <reason>
    permission: moderex.masskick

  massban:
    description: Ban multiple players at once
    usage: /<command> <player1,player2,...> <duration> <reason>
    permission: moderex.massban

  massunwarn:
    description: Remove a mass warning by case ID
    usage: /<command> <caseId>
    permission: moderex.massunwarn

  massunmute:
    description: Remove a mass mute by case ID
    usage: /<command> <caseId>
    permission: moderex.massunmute

  massunban:
    description: Remove a mass ban by case ID
    usage: /<command> <caseId>
    permission: moderex.massunban

