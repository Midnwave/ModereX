  # ==================== WILDCARD PERMISSIONS ====================
  moderex.*:
    description: Access to all ModereX features
    default: op
    children:
      moderex.command.*: true
      moderex.bypass.*: true
      moderex.alerts.*: true
      moderex.info.*: true
      moderex.logs.*: true
      moderex.stafflogs.*: true
      moderex.flag.*: true
      moderex.automod.*: true
      moderex.template.*: true
      moderex.mass.*: true
      moderex.monitoring.*: true
      moderex.notify.*: true
      moderex.punish.*: true
      moderex.replay.*: true
      moderex.status.*: true
      moderex.staff: true
      moderex.admin: true
      moderex.admin.performance: true
      moderex.admin.throttle: true
      moderex.admin.security: true
      moderex.admin.ai: true
      moderex.admin.rules: true
      moderex.ai.*: true
      moderex.security: true
      moderex.security.lockdown: true
      moderex.security.tokens: true
      moderex.rules.manage: true
      moderex.rules.ai: true

