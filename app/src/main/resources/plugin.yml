  # ==================== WILDCARD PERMISSIONS ====================
  moderex.*:
    description: Access to all ModereX features
    default: op
    children:
      moderex.command.*: true
      moderex.bypass.*: true
      moderex.alerts.*: true
      moderex.info.*: true
      moderex.history.*: true
      moderex.flag.*: true
      moderex.automod.*: true
      moderex.template.*: true
      moderex.mass.*: true
      moderex.monitoring.*: true
      moderex.staff: true

  moderex.command.*:
    description: Access to all ModereX commands
    default: op
    children:
      moderex.ban: true
      moderex.tempban: true
      moderex.ipban: true
      moderex.mute: true
      moderex.tempmute: true
      moderex.ipmute: true
      moderex.warn: true
      moderex.kick: true
      moderex.unban: true
      moderex.unmute: true
      moderex.unwarn: true
      moderex.clearwarnings: true
      moderex.punish: true
      moderex.history: true
      moderex.staffhistory: true
      moderex.checkban: true
      moderex.checkmute: true
      moderex.checkwarn: true
      moderex.banlist: true
      moderex.mutelist: true
      moderex.warnlist: true
      moderex.command.viewpunishment: true
      moderex.command.seen: true
      moderex.command.lastuuid: true
      moderex.command.staffchat: true
      moderex.command.watchlist: true
      moderex.command.fly: true
      moderex.command.fly.others: true
      moderex.command.broadcast: true
      moderex.command.invsee: true
      moderex.command.echest: true
      moderex.command.echest.others: true
      moderex.dupeip: true
      moderex.ipreport: true
      moderex.geoip: true
      moderex.log: true
      moderex.log.teleport: true
      moderex.cmdblacklist: true
      moderex.cmdunblacklist: true
      moderex.vanish: true
      moderex.vanish.others: true
      moderex.disguise: true
      moderex.lockdown: true
      moderex.prunehistory: true
      moderex.staffrollback: true
      moderex.reload: true
