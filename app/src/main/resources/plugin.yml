  moderex.flag.silent:
    description: Use -s flag for silent punishments
    default: op

  moderex.flag.extrasilent:
    description: Use -es flag for extra silent punishments
    default: op

  moderex.flag.public:
    description: Use -p flag for public announcements
    default: op

  moderex.flag.global:
    description: Use -g flag for global (cross-server) punishments
    default: op

  moderex.flag.hidden:
    description: Use -h flag to hide from punishment lists
    default: op

  moderex.flag.skip:
    description: Use -skip flag to skip confirmation
    default: op

  # ==================== PUNISHMENT MODIFIER PERMISSIONS ====================
  moderex.punish.delete:
    description: Delete punishments from database and player history
    default: op

  moderex.punish.modify:
    description: Edit punishments via case ID
    default: op

  # ==================== AUTOMOD PERMISSIONS ====================
  moderex.automod.*:
