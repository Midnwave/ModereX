      moderex.prunehistory: true
      moderex.staffrollback: true
      moderex.reload: true
      moderex.rules: true

  moderex.bypass.*:
    description: Bypass all restrictions
    default: op
    children:
      moderex.bypass.automod: true
      moderex.bypass.automod.nickname: true
      moderex.bypass.lockdown: true
      moderex.bypass.chatdisable: true
      moderex.bypass.chatslowmode: true
      moderex.bypass.clearchat: true
      moderex.bypass.mute: true
      moderex.bypass.afk: true
      moderex.bypass.slowmode: true
      moderex.bypass.raidprotection: true
      moderex.bypass.captcha: true

  # Core Punishment Permissions
  moderex.ban:
    description: Ban players
    default: op

  moderex.mute:
    description: Mute players
    default: op

  moderex.warn:
    description: Warn players
    default: op

  moderex.kick:
    description: Kick players
    default: op

  moderex.tempban:
    description: Temporarily ban players
    default: op

  moderex.tempmute:
