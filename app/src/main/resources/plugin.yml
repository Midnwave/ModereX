  # ==================== WATCHLIST LOG PERMISSIONS ====================
  moderex.logs.watchlist.*:
    description: View all watchlist player activity logs
    default: op
    children:
      moderex.logs.watchlist.warns: true
      moderex.logs.watchlist.kicks: true
      moderex.logs.watchlist.bans: true
      moderex.logs.watchlist.mutes: true
      moderex.logs.watchlist.automod: true
      moderex.logs.watchlist.commands: true
      moderex.logs.watchlist.chat: true

  moderex.logs.watchlist.warns:
    description: View watchlist player warning logs
    default: op

  moderex.logs.watchlist.kicks:
    description: View watchlist player kick logs
    default: op

  moderex.logs.watchlist.bans:
    description: View watchlist player ban logs
