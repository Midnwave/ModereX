      moderex.bypass.automod: true
      moderex.bypass.lockdown: true
      moderex.bypass.chatdisable: true
      moderex.bypass.chatslowmode: true
      moderex.bypass.mute: true
      moderex.bypass.afk: true

  # Core Punishment Permissions
  moderex.ban:
    description: Ban players
    default: op

  moderex.mute:
    description: Mute players
    default: op

  moderex.warn:
    description: Warn players
    default: op

  moderex.kick:
    description: Kick players
    default: op

  moderex.tempban:
    description: Temporarily ban players
    default: op

  moderex.tempmute:
    description: Temporarily mute players
    default: op

  moderex.ipban:
    description: IP ban players
    default: op

  moderex.ipmute:
    description: IP mute players
    default: op

  moderex.ipwarn:
    description: IP warn players
    default: op

  # Unpunishment Permissions
  moderex.unban:
    description: Unban players
    default: op

  moderex.unmute:
    description: Unmute players
    default: op

  moderex.unwarn:
    description: Remove warnings
    default: op

  # ==================== FLAG PERMISSIONS ====================
  moderex.flag.*:
    description: Use all punishment flags
    default: op
    children:
      moderex.flag.silent: true
      moderex.flag.extrasilent: true
      moderex.flag.public: true
      moderex.flag.global: true
