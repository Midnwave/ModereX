    description: Access to all ModereX commands
    default: op
    children:
      moderex.ban: true
      moderex.tempban: true
      moderex.ipban: true
      moderex.mute: true
      moderex.tempmute: true
      moderex.ipmute: true
      moderex.warn: true
      moderex.kick: true
      moderex.unban: true
      moderex.unmute: true
      moderex.unwarn: true
      moderex.punish: true
      moderex.logs: true
      moderex.staffhistory: true
      moderex.checkban: true
      moderex.checkmute: true
      moderex.checkwarn: true
      moderex.banlist: true
      moderex.mutelist: true
      moderex.warnlist: true
      moderex.command.viewpunishment: true
      moderex.command.seen: true
      moderex.command.lastuuid: true
      moderex.command.staffchat: true
      moderex.command.watchlist: true
      moderex.command.fly: true
      moderex.command.fly.others: true
      moderex.command.broadcast: true
