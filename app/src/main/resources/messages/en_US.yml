tempmute:
  success: "<green>Successfully temporarily muted <yellow><player></yellow> for <white><duration></white>."
  broadcast: "<staff_prefix><gray><staff></gray> <gold>temporarily muted</gold> <player_prefix><yellow><player></yellow> for <white><duration></white>. Reason: <white><reason>"
  duration-required: "<red>Duration is required for temporary mutes. Use: /tempmute <player> <duration> [reason]"

