    <gradient:#FF6B6B:#4ECDC4>[ModereX]</gradient>

    <red><bold>\u00a1Has sido Baneado!</bold></red>

    <gray>Baneado el: <white><date></white>
    <gray>Baneado por: <white><staff></white>
    <gray>Duraci\u00f3n: <white><duration></white>
    <gray>Raz\u00f3n: <white><reason></white><evidence>

