  message: "<red>Has sido silenciado por <white><duration></white>.\n<gray>Raz\u00f3n: <white><reason><evidence>"
  already-muted: "<red><player> ya est\u00e1 silenciado."
  chat-attempt: "<red>Est\u00e1s silenciado por <white><duration></white>.\n<gray>Raz\u00f3n: <white><reason>"

unmute:
  success: "<green>Desilenciado exitosamente <yellow><player></yellow>."
  broadcast: "<gradient:#FF6B6B:#4ECDC4>[ModereX]</gradient> <gray><staff></gray> <green>desilenci\u00f3</green> <yellow><player></yellow> <dark_gray>|</dark_gray> <gray>Caso:</gray> <yellow><case_id></yellow>"
  not-muted: "<red><player> no est\u00e1 silenciado."

