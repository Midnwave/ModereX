# ModereX Messages - Espa\u00f1ol (Espa\u00f1a)
# Puedes usar formato MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Los marcadores se envuelven en <> como <player>, <reason>, <duration>

# ============================================
# GENERAL
# ============================================
general:
  prefix: "<gradient:#FF6B6B:#4ECDC4>[ModereX]</gradient> "
  no-permission: "<red>No tienes permiso para hacer eso."
  player-not-found: "<red>Jugador no encontrado: <white><player>"
  player-only: "<red>Este comando solo puede ser usado por jugadores."
  invalid-duration: "<red>Formato de duraci\u00f3n inv\u00e1lido. Usa: 1mo, 3d, 1h, 30m, 15s, o permanent"
  invalid-arguments: "<red>Argumentos inv\u00e1lidos. Uso: <white><usage>"
  reload-success: "<green>\u00a1Configuraci\u00f3n recargada exitosamente!"
  plugin-info: "<gray>ModereX v<version> por BlockForge Studios & ADF Industries LLC."

# ============================================
# MUTE
# ============================================
mute:
