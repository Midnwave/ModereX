# ModereX Messages - Deutsch (Deutschland)
# Du kannst MiniMessage-Formatierung verwenden: https://docs.advntr.dev/minimessage/format.html
# Platzhalter werden in <> geschrieben, z.B. <player>, <reason>, <duration>

# ============================================
# ALLGEMEIN
# ============================================
general:
  prefix: "<gradient:#FF6B6B:#4ECDC4>[ModereX]</gradient> "
  no-permission: "<red>Du hast keine Berechtigung dies zu tun."
  player-not-found: "<red>Spieler nicht gefunden: <white><player>"
  player-only: "<red>Dieser Befehl kann nur von Spielern verwendet werden."
  invalid-duration: "<red>Ung\u00fcltiges Dauerformat. Verwende: 1mo, 3d, 1h, 30m, 15s, oder permanent"
  invalid-arguments: "<red>Ung\u00fcltige Argumente. Verwendung: <white><usage>"
  reload-success: "<green>Konfiguration erfolgreich neu geladen!"
  plugin-info: "<gray>ModereX v<version> von BlockForge Studios & ADF Industries LLC."

# ============================================
# STUMMSCHALTUNG
# ============================================
mute:
  success: "<green><yellow><player></yellow> erfolgreich f\u00fcr <white><duration></white> stummgeschaltet."
  broadcast: "<gradient:#FF6B6B:#4ECDC4>[ModereX]</gradient> <gray><staff></gray> hat <yellow><player></yellow> <gold>stummgeschaltet</gold> <gray>f\u00fcr</gray> <white><duration></white> <dark_gray>|</dark_gray> <gray>Fall:</gray> <yellow><case_id></yellow>\n<gray>Grund: <white><reason>"
  message: "<red>Du wurdest f\u00fcr <white><duration></white> stummgeschaltet.\n<gray>Grund: <white><reason><evidence>"
  already-muted: "<red><player> ist bereits stummgeschaltet."
  chat-attempt: "<red>Du bist f\u00fcr <white><duration></white> stummgeschaltet.\n<gray>Grund: <white><reason>"

unmute:
  success: "<green><yellow><player></yellow> erfolgreich entstummt."
  broadcast: "<gradient:#FF6B6B:#4ECDC4>[ModereX]</gradient> <gray><staff></gray> hat <yellow><player></yellow> <green>entstummt</green> <dark_gray>|</dark_gray> <gray>Fall:</gray> <yellow><case_id></yellow>"
  not-muted: "<red><player> ist nicht stummgeschaltet."

# ============================================
# BANN
# ============================================
ban:
