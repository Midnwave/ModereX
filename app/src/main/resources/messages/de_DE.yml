  already-banned: "<red><player> ist bereits gebannt."
  disconnect: |
    <gradient:#FF6B6B:#4ECDC4>[ModereX]</gradient>

    <red><bold>Du wurdest gebannt!</bold></red>

    <gray>Gebannt am: <white><date></white>
    <gray>Gebannt von: <white><staff></white>
    <gray>Dauer: <white><duration></white>
    <gray>Grund: <white><reason></white><evidence>

    <yellow>Einspruch unter: discord.gg/example

