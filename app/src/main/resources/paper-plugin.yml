      - moderex.notify.*
      - moderex.punish.*
      - moderex.replay.*
      - moderex.status.*
      - moderex.staff
      - moderex.admin

  moderex.command.*:
    description: Access to all ModereX commands
    default: op
    children:
      - moderex.ban
      - moderex.tempban
      - moderex.ipban
      - moderex.mute
      - moderex.tempmute
      - moderex.ipmute
      - moderex.warn
      - moderex.kick
      - moderex.unban
      - moderex.unmute
      - moderex.unwarn
