name: ModereX
version: '${version}'
main: com.blockforge.moderex.ModereX
api-version: '1.21'
description: |
  Advanced, premium moderation for Minecraft.

  Copyright (c) 2024-2026 BlockForge Studios. All rights reserved.
  The ModereX Web Panel and all associated assets are proprietary software.
  Redistribution, modification, or commercial use of the web panel component
  is strictly prohibited without explicit written permission from BlockForge Studios.
authors:
  - BlockForge Studios
  - ADF Industries
website: https://github.com/blockforge/moderex

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Grim:
      load: BEFORE
      required: false
      join-classpath: true
    Vulcan:
      load: BEFORE
      required: false
      join-classpath: true
    Matrix:
      load: BEFORE
      required: false
      join-classpath: true
    Spartan:
      load: BEFORE
      required: false
      join-classpath: true
    Intave:
      load: BEFORE
      required: false
      join-classpath: true
    Karhu:
      load: BEFORE
      required: false
      join-classpath: true
    Polar:
      load: BEFORE
      required: false
      join-classpath: true
    NoCheatPlus:
      load: BEFORE
      required: false
      join-classpath: true
    Essentials:
      load: BEFORE
      required: false
      join-classpath: true
    CMI:
      load: BEFORE
      required: false
      join-classpath: true
    LiteBans:
      load: BEFORE
      required: false
      join-classpath: true
    AdvancedBan:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  # ==================== WILDCARD PERMISSIONS ====================
  moderex.*:
    description: Access to all ModereX features
    default: op
    children:
      - moderex.command.*
      - moderex.bypass.*
      - moderex.alerts.*
      - moderex.info.*
      - moderex.history.*
      - moderex.flag.*
      - moderex.automod.*

  moderex.command.*:
    description: Access to all ModereX commands
    default: op
    children:
      - moderex.ban
      - moderex.tempban
      - moderex.ipban
      - moderex.mute
      - moderex.tempmute
      - moderex.ipmute
      - moderex.warn
      - moderex.kick
      - moderex.unban
      - moderex.unmute
      - moderex.unwarn
      - moderex.clearwarnings
      - moderex.punish
      - moderex.command.seen
      - moderex.command.lastuuid
      - moderex.command.viewpunishment
      - moderex.command.staffchat
      - moderex.command.watchlist
      - moderex.cmdblacklist
      - moderex.cmdunblacklist
      - moderex.vanish
      - moderex.disguise
      - moderex.log
      - moderex.reload

  moderex.bypass.*:
    description: Bypass all restrictions
    default: op
    children:
      - moderex.bypass.automod
      - moderex.bypass.lockdown
      - moderex.bypass.chatdisable
      - moderex.bypass.chatslowmode
      - moderex.bypass.mute
      - moderex.bypass.afk

  # ==================== PUNISHMENT PERMISSIONS ====================
  moderex.ban:
    description: Ban players permanently and temporarily
    default: op
  moderex.tempban:
    description: Only temp ban players
    default: op
  moderex.ipban:
    description: Ban players by IP address
    default: op
  moderex.mute:
    description: Mute players permanently and temporarily
    default: op
  moderex.tempmute:
    description: Only temp mute players
    default: op
  moderex.ipmute:
    description: Mute players by IP address
    default: op
  moderex.warn:
    description: Warn players
    default: op
  moderex.kick:
    description: Kick players
    default: op
  moderex.punish:
    description: Open the punishment GUI
    default: op

  # ==================== UNPUNISHMENT PERMISSIONS ====================
  moderex.unban:
    description: Remove an active ban
    default: op
  moderex.unmute:
    description: Remove an active mute
    default: op
  moderex.unwarn:
    description: Remove an active warning
    default: op
  moderex.clearwarnings:
    description: Clear all warnings for a player
    default: op

  # ==================== PUNISHMENT MODIFIER PERMISSIONS ====================
  moderex.punish.delete:
    description: Delete punishments from database
    default: op
  moderex.punish.modify:
    description: Edit punishments via case ID
    default: op

  # ==================== FLAG PERMISSIONS ====================
  moderex.flag.*:
    description: Use all punishment flags
    default: op
    children:
      - moderex.flag.silent
      - moderex.flag.extrasilent
      - moderex.flag.public
      - moderex.flag.global
      - moderex.flag.hidden
      - moderex.flag.skip

  moderex.flag.silent:
    description: Use -s flag for silent punishments
    default: op
  moderex.flag.extrasilent:
    description: Use -es flag for extra silent punishments
    default: op
  moderex.flag.public:
    description: Use -p flag for public announcements
    default: op
  moderex.flag.global:
    description: Use -g flag for global punishments
    default: op
  moderex.flag.hidden:
    description: Use -h flag to hide from lists
    default: op
  moderex.flag.skip:
    description: Use -skip flag to skip confirmation
    default: op

  # ==================== INFO PERMISSIONS ====================
  moderex.info.*:
    description: View all player information
    default: op
    children:
      - moderex.info.ip
      - moderex.info.uuid
      - moderex.info.nick
      - moderex.info.joindate
      - moderex.info.time
      - moderex.info.namehistory

  moderex.info.ip:
    description: View player IP address
    default: op
  moderex.info.uuid:
    description: View player UUID
    default: op
  moderex.info.nick:
    description: View current nickname
    default: op
  moderex.info.joindate:
    description: View join date
    default: op
  moderex.info.time:
    description: View online/offline time
    default: op
  moderex.info.namehistory:
    description: View previous usernames
    default: op

  # ==================== HISTORY PERMISSIONS ====================
  moderex.history.*:
    description: View all history
    default: op
    children:
      - moderex.history.warns
      - moderex.history.kicks
      - moderex.history.bans
      - moderex.history.mutes
      - moderex.history.nick
      - moderex.history.automod
      - moderex.history.commands
      - moderex.history.chat

  moderex.history.warns:
    description: View warning history
    default: op
  moderex.history.kicks:
    description: View kick history
    default: op
  moderex.history.bans:
    description: View ban history
    default: op
  moderex.history.mutes:
    description: View mute history
    default: op
  moderex.history.nick:
    description: View nickname history
    default: op
  moderex.history.automod:
    description: View automod logs
    default: op
  moderex.history.commands:
    description: View command history
    default: op
  moderex.history.chat:
    description: View chat history
    default: op

  # ==================== WATCHLIST HISTORY ====================
  moderex.history.watchlist.*:
    description: View watchlist player history
    default: op
    children:
      - moderex.history.watchlist.warns
      - moderex.history.watchlist.kicks
      - moderex.history.watchlist.bans
      - moderex.history.watchlist.mutes
      - moderex.history.watchlist.automod
      - moderex.history.watchlist.commands
      - moderex.history.watchlist.chat

  # ==================== AUTOMOD PERMISSIONS ====================
  moderex.automod.*:
    description: Full automod access
    default: op
    children:
      - moderex.automod.view
      - moderex.automod.edit
      - moderex.automod.create
      - moderex.automod.delete

  moderex.automod.view:
    description: View automod configuration
    default: op
  moderex.automod.edit:
    description: Configure automod rules
    default: op
  moderex.automod.create:
    description: Create automod rules
    default: op
  moderex.automod.delete:
    description: Delete automod rules
    default: op

  # ==================== COMMAND PERMISSIONS ====================
  moderex.command.seen:
    description: Use /seen command
    default: op
  moderex.command.lastuuid:
    description: Display player UUID
    default: op
  moderex.command.viewpunishment:
    description: View punishment by case ID
    default: op
  moderex.command.staffchat:
    description: Send messages to staff chat
    default: op
  moderex.command.watchlist:
    description: Manage watchlist
    default: op

  # ==================== WATCHLIST PERMISSIONS ====================
  moderex.watchlist.add:
    description: Add players to watchlist
    default: op
  moderex.watchlist.remove:
    description: Remove players from watchlist
    default: op

  # ==================== OTHER PERMISSIONS ====================
  moderex.cmdblacklist:
    description: Blacklist commands for players
    default: op
  moderex.cmdunblacklist:
    description: Remove command blacklists
    default: op
  moderex.log:
    description: View activity log
    default: op
  moderex.log.teleport:
    description: Teleport from activity log
    default: op
  moderex.vanish:
    description: Toggle vanish
    default: op
  moderex.disguise:
    description: Use disguise command
    default: op
  moderex.staffhistory:
    description: View staff history
    default: op

  # ==================== BYPASS PERMISSIONS ====================
  moderex.bypass.automod:
    description: Bypass automod
    default: op
  moderex.bypass.lockdown:
    description: Bypass lockdown
    default: op
  moderex.bypass.chatdisable:
    description: Bypass chat disable
    default: op
  moderex.bypass.chatslowmode:
    description: Bypass slowmode
    default: op
  moderex.bypass.mute:
    description: Bypass mute
    default: false
  moderex.bypass.afk:
    description: Bypass AFK detection
    default: op

  # ==================== ALERT PERMISSIONS ====================
  moderex.alerts.*:
    description: See all alerts
    default: op
    children:
      - moderex.alerts.punishments
      - moderex.alerts.automod
      - moderex.alerts.anticheat
      - moderex.alerts.staffchat
      - moderex.alerts.silent
      - moderex.alerts.joinleave
      - moderex.alerts.watchlist
      - moderex.alerts.lag
      - moderex.alerts.nickname
      - moderex.alerts.commands

  moderex.alerts.punishments:
    description: See punishment broadcasts
    default: op
  moderex.alerts.automod:
    description: See automod alerts
    default: op
  moderex.alerts.anticheat:
    description: See anticheat alerts
    default: op
  moderex.alerts.staffchat:
    description: See staff chat
    default: op
  moderex.alerts.silent:
    description: See silent punishments
    default: op
  moderex.alerts.joinleave:
    description: See join/leave alerts
    default: op
  moderex.alerts.watchlist:
    description: See watchlist alerts
    default: op
  moderex.alerts.lag:
    description: See lag alerts
    default: op
  moderex.alerts.nickname:
    description: See nickname alerts
    default: op
  moderex.alerts.commands:
    description: See command alerts
    default: op

  # ==================== ADMINISTRATION ====================
  moderex.reload:
    description: Reload the plugin
    default: op

  # ==================== WEB PANEL (PROTECTED) ====================
  moderex.webpanel:
    description: Access web panel (protected)
    default: op
