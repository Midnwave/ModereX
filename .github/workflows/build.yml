name: Dev Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/**'  # Don't trigger on releases folder changes
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon

    - name: Get version from build.gradle
      id: version
      run: |
        VERSION=$(grep "^version = " app/build.gradle | sed "s/version = '\(.*\)'/\1/")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Copy JAR to releases folder
      run: |
        mkdir -p releases
        cp app/build/libs/ModereX-${{ steps.version.outputs.version }}.jar releases/ModereX-latest.jar
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > releases/build-info.txt
        echo "Version: ${{ steps.version.outputs.version }}" >> releases/build-info.txt
        echo "Commit: ${{ github.sha }}" >> releases/build-info.txt

    - name: Commit and push JAR
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add releases/ModereX-latest.jar releases/build-info.txt
        git commit -m "build: Update ModereX-latest.jar (v${{ steps.version.outputs.version }})" || echo "No changes to commit"
        git push
