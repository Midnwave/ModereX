name: Dev Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/**'  # Don't trigger on releases folder changes
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

env:
  # Offset to continue from existing build numbers (68 was last)
  BUILD_OFFSET: 50

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Calculate build number
      id: buildnum
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + ${{ env.BUILD_OFFSET }} ))
        echo "number=$BUILD_NUM" >> $GITHUB_OUTPUT
        echo "Build number: $BUILD_NUM"

    - name: Sync version properties with CI build number
      run: |
        BUILD_NUM=${{ steps.buildnum.outputs.number }}
        cat > app/src/main/resources/panel-version.properties << PROPS
        # ModereX Version - Edit this file to update the version everywhere.
        # Gradle reads this at build time. Plugin reads this at runtime.
        version=2.0dev-${BUILD_NUM}
        buildNumber=${BUILD_NUM}
        buildDate=$(date -u +%Y-%m-%d)
        PROPS
        # Remove leading whitespace from heredoc
        sed -i 's/^        //' app/src/main/resources/panel-version.properties
        echo "Version properties synced to build ${BUILD_NUM}"
        cat app/src/main/resources/panel-version.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon

    - name: Copy JAR to releases folder
      id: version
      run: |
        VERSION="2.0dev-${{ steps.buildnum.outputs.number }}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        mkdir -p releases
        # Find the built JAR (it will be named ModereX-{version}.jar based on build.gradle)
        JAR_FILE=$(ls app/build/libs/ModereX-*.jar | head -1)
        if [ -z "$JAR_FILE" ]; then
          echo "Error: No JAR file found in app/build/libs/"
          exit 1
        fi
        echo "Found JAR: $JAR_FILE"
        cp "$JAR_FILE" "releases/ModereX-${VERSION}.jar"
        cp "$JAR_FILE" releases/ModereX-latest.jar
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > releases/build-info.txt
        echo "Version: $VERSION" >> releases/build-info.txt
        echo "Build: ${{ steps.buildnum.outputs.number }}" >> releases/build-info.txt
        echo "Commit: ${{ github.sha }}" >> releases/build-info.txt

    - name: Clean up old releases (keep last 3)
      run: |
        cd releases
        ls -1 ModereX-2.0dev-*.jar 2>/dev/null | sort -t'-' -k3 -n | head -n -3 | xargs -r rm -f
        echo "Remaining versioned JARs:"
        ls -1 ModereX-2.0dev-*.jar 2>/dev/null || echo "None"

    - name: Commit and push JAR
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add releases/
        git commit -m "build: Update ModereX-latest.jar (v${{ steps.version.outputs.version }})" || echo "No changes to commit"
        git push
